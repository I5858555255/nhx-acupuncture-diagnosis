      全书核心方法论：覆盖 12 个已通过验证的候选单元（f02/f03/f04/f05/f06/f07/f08/f09/f10/
      f15/f16/f20 及 p06/p11/p12/p15/p18/p19/p20/p25），在第二/三/四/五/六章反复出现，
      是"辨证→取穴"主决策链路，所有治症方案的通用入口。
    one_liner: 病位归经→辨虚实寒热→按法则（子母/俞募/会郄/原络/本穴）选穴，左病右治。
    intents:
      - 帮我看这个肩痛/腰痛/头痛应该怎么取穴
      - 这种痛是新病还是久病，该补还是泻
      - 内科病（胃病/心脏病/肝病）怎么选穴
      - 怎么判断该用哪个治疗法则（子母/俞募/会郄）
      - 某个穴位怎么找到具体位置
