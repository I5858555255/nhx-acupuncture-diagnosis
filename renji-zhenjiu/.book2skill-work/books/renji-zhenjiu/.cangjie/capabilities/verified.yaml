entry:
  name: renji-zhenjiu
  description: |
    倪海厦《人纪·针灸篇》系统课程蒸馏包。覆盖传统针灸完整链条：穴位丈量与经络走行、
    五行取穴文法（井荣俞原经合、子母补泻）、治疗法则分工（俞募/会郄/原络/本穴）、
    四诊诊断（背俞压痛点、眼诊、耳针、望诊、时症）、治症选穴方案（头面五官、脏腑、妇科、
    伤科、急症）、安全禁忌与急救序列（回阳九针、十三鬼穴、灵龟八法、放血法）、
    小儿指针术与家庭养生。适用于"某症怎么取穴""某穴在哪/怎么找/主治什么""怎么判断虚实寒热"
    "针灸有哪些禁忌"等问诊与取穴辅助；仅供专业针灸医师与中医药学习者参考。
  core_principles:
  - 辨证选穴先归经：必须知道痛在哪条经、病在哪个脏腑，绝不"哪里痛扎哪里"。
  - 五行生克是决策文法：虚则补其母、实则泻其子；先强将被克之脏阻断传变。
  - 按病性分派法则：内科病用俞募、经络四肢痛用子母、骨伤急症用会郄、表里同病用原络。
  - 诊断靠压痛点+望闻问：背俞穴压痛定脏腑、耳针压痛定病位、眼诊五色定五脏；脚热=健康。
  - 安全第一：针而勿灸灸勿针、大虚/汗/酒后不针、热/汗处/眼/阴不灸、孕妇禁针合谷三阴交。
  - 疗效立竿见影：正确取穴下针即效；病退不改方，病进必改穴。
  - 操作须专业：放血、深刺、灸百壮等属专业医疗行为，禁止非专业人士自行施治。
  out_of_scope:
  - 西医诊断与用药建议（本书对现代医学的批评属作者立场，非循证结论，不得作为医疗建议）。
  - 治癌/治AIDS 等超出循证范围的声称（仅作为历史观点引用，不提供治疗方案）。
  - 真人示范类操作细节（进针手势、放血手法）——文字无法替代临床指导。
  - 繁体/简体的古籍原文考据与版本校勘。
  stop_conditions:
  - 用户描述的是急症/危重症（昏迷、大出血、剧烈胸痛等）时，停止给出针灸方案，提示立即就医。
  - 用户明确是孕妇、婴幼儿（非指针术场景）或体质极度虚弱者时，仅给禁忌提示，不给针刺方案。
  - 用户表明自己非医疗专业人员且准备自行施针时，停止输出具体操作，提示必须由执业医师操作。
  - 涉及"治愈癌症/肿瘤/艾滋病"等重大疾病承诺时，拒绝并按边界处理。
router_entry:
  name: renji-zhenjiu-source
  description: |
    人纪针灸全书来源路由入口。当用户询问书中任意术语定义（同身寸、井荣俞原经合、天应穴、
    灵龟八法、回阳九针等）、经络穴位索引、书中案例细节、作者观点原文，或不确定该用哪个
    子能力时，由此入口路由到对应能力卡或共享词典；也承载未晋级为独立 Skill 的术语与案例素材。
