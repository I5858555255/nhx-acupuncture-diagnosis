    const dqk=tm.m[0];

  let h="";

  h+=`<div class="scrow"><b>灵龟八法：</b>${calc.total} ÷ ${calc.yang?9:6} 余 ${calc.rem} → ${calc.gua}卦　通 ${vessel}</div>`;
  h+=`<div class="scrow scpt">主穴【${main}】${inM(pointName(main))?"<span class='hit'>·与病经一致</span>":""}　配穴【${paired}】${inM(pointName(paired))?"<span class='hit'>·与病经一致</span>":""}${calc.gd?(shiGen?(" · 已按"+(shiGen==="male"?"男":"女")):(" · 余数5需辨性别（默认男）")):""}</div>`;
  if(calc.gd){ h+=`<div class="scrow"><span class="sg" onclick="setShiGen('male')">男</span><span class="sg" onclick="setShiGen('female')">女</span></div>`; }
  [main,paired].forEach(n=>{ const pc=pointCard(n); if(pc) h+=`<details class="ptd"><summary>${esc(n)} · 定位/禁忌</summary>${pc}</details>`; });
  h+=`<div class="scrow"><b>子午流注（纳子法）：</b>${zl||"（当令经数据缺失）"}</div>`;
  h+=`<div class="scrow scctrl"><input type="datetime-local" id="shiCustom" value="${isoLocal(c)}" onchange="setShiCustom(this.value)"> <button class="btn ghost" onclick="setShiCustom(null)">当前时间</button></div>`;
  box.innerHTML=h;
}
function setShiGen(g){ shiGen=g; renderShichen(); }

const state = { idx:0, kw:"", answers:{region:null, regionSub:null, signals:[], sleep:"none", course:null, pain:null, coldhot:null, urine:null, obs:{wang:[],chu:[],safety:[]}}, hit:null };
const $ = id => document.getElementById(id);
/* ============ 特效库检索（自由输入 → 自动分流） ============ */
const DICT_TAGS = ["鸡眼","头痛","偏头痛","落枕","便秘","鼻窦炎","胃痛","痔疮","痛经","腰扭伤","水肿","中风","癫痫"];
function freeSearch(){
  const kw = $("kw").value.trim();
  if(!kw){ return; }
  const hit = DICT.filter(d=>d.k.some(k=>kw.includes(k)));
  if(hit.length){
    state.hit = hit; state.kw = kw;
    renderResult(true); $("wizard").style.display="none"; $("prog").style.display="none"; $("result").style.display="block";
    window.scrollTo({top:0,behavior:"smooth"});
  } else {
    state.hit = null; state.kw = kw;
    $("wizard").style.display="block"; $("prog").style.display="flex"; state.idx=0;
    renderStep();
  }
}
document.getElementById("kw").addEventListener("keydown",function(e){ if(e.key==="Enter") freeSearch(); });

/* ============ 推理引擎 ============ */
function gatherMeridians(){
  const pri=[], sec=[], seen={};
  const add=(k,kind)=>{ if(k && !seen[k]){ seen[k]=1; if(kind==='p')pri.push(k); else sec.push(k); } };
  const reg=REGIONS.find(r=>r.id===state.answers.region);
  if(reg){ (reg.sub && state.answers.regionSub && state.answers.regionSub.length ? reg.sub.find(s=>s.t===state.answers.regionSub).m : reg.m).forEach(k=>add(k,'p')); }
  state.answers.signals.forEach(sid=>{ const s=SIGNALS.find(x=>x.id===sid); if(s){ s.m.forEach(k=>add(k,'s')); } });
  if(state.answers.sleep && state.answers.sleep!=="none" && TIME_MAP[state.answers.sleep]){ TIME_MAP[state.answers.sleep].m.forEach(k=>add(k,'s')); }
  (state.answers.obs.wang||[]).forEach(wid=>{ const w=WANG.find(x=>x.id===wid); if(w && w.push){ add(w.push,'s'); } });
  (state.answers.obs.chu||[]).forEach(cid=>{ const c=CHU.find(x=>x.id===cid); if(c && c.push){ add(c.push,'s'); } });
  return {pri, sec, all:[...pri,...sec]};
}
function countSupport(k){
  let n=0;
  state.answers.signals.forEach(sid=>{ const s=SIGNALS.find(x=>x.id===sid); if(s && s.m.includes(k)) n++; });
  if(state.answers.sleep && state.answers.sleep!=="none" && TIME_MAP[state.answers.sleep] && TIME_MAP[state.answers.sleep].m.includes(k)) n++;
  (state.answers.obs.wang||[]).forEach(wid=>{ const w=WANG.find(x=>x.id===wid); if(w && w.push===k) n++; });
  (state.answers.obs.chu||[]).forEach(cid=>{ const c=CHU.find(x=>x.id===cid); if(c && c.push===k) n++; });
  return n;
}
function xushiDecide(){
  const p=state.answers.pain;
  if(p==="numb") return {v:"xu", label:"大虚（麻木）", basis:"麻=最虚最难治，宜补、疗程长（指南5.2）"};
  if(p==="acid") return {v:"xu", label:"虚（只酸不痛、喜按）", basis:"只酸/喜按=虚，补母穴（指南5.2）"};
  if(p==="pain_acid") return {v:"shi_first", label:"实中带虚（痛多酸少）", basis:"痛多酸少=先泻后补（指南5.2）"};
  if(p==="acid_pain") return {v:"xu_first", label:"虚中带实（酸多痛少）", basis:"酸多痛少=先补后泻（指南5.2）"};
  if(p==="pain" || state.answers.course==="acute") return {v:"shi", label:"实（痛拒按/新病）", basis:"痛拒按/一周内=实，泻子穴（指南5.2）"};
  if(p==="na" && state.answers.course!=="chronic") return {v:"shi", label:"（按脏腑证候定）", basis:"无痛酸麻者以病程与脏腑证候定虚实"};
  if(state.answers.course==="chronic") return {v:"xu", label:"虚（久病）", basis:"久病多虚，补母穴（指南5.2）"};
  return {v:"shi", label:"实", basis:"按病程与疼痛判定（指南5.2）"};
}
function coldhotDecide(){
  const c=state.answers.coldhot, u=state.answers.urine;
  const obsHot = (state.answers.obs.wang||[]).some(id=>id==="w_tongue_hot");
  const obsCold = (state.answers.obs.wang||[]).some(id=>id==="w_tongue_cold");
  if(c==="cold"||u==="cold"||obsCold) return {v:"cold", label:"寒", basis:"喜热饮/怕冷/不渴/小便清白/苔白厚=寒，宜灸（指南5.3）"};
  if(c==="hot"||u==="hot"||obsHot) return {v:"hot", label:"热", basis:"喜冷饮/怕热/渴冷/小便黄/苔黄湿=热，宜针（指南5.3）"};
  return {v:"none", label:"寒热不显", basis:"以虚实定补泻"};
}
function wuxingDecide(mids){
  const found=[];
  mids.forEach(k=>{ if(WM[k]){ found.push({d:M[k].name, ...WM[k]}); } });
  return found;
}
function buildPlan(mids, xd, cd){
  const mains=[], aux=[], others=[]; const reasons=[]; const px={};
  const addp=(list,n,d,w)=>{ const key=pointName(n); if(!px[key]){ px[key]=1; list.push({n,d,w}); } };
  const primary = mids.pri[0] || mids.sec[0];
  // ── 主穴（必取）：主病经(pri[0])的子母补泻 / 奇经要穴；其余 pri 作次主入佐穴 ──
  mids.pri.forEach((k,i)=>{
    if(EXTRA[k]){ addp(i===0?mains:aux, EXTRA[k].name+" · "+EXTRA[k].point, EXTRA[k].note, "奇经要穴"); return; }
    const m=M[k]; if(!m) return;
    const t=m.tabs?("（表里："+m.tabs+"）"):"";
    const isChild=(xd.v==="shi"||xd.v==="shi_first");
    addp(i===0?mains:aux, isChild?m.child:m.mother, m.name+(isChild?"子穴（泻）":"母穴（补）")+t, (isChild?"实症泻子":"虚症补母")+(i===0?"（主病经）":"（次主）"));
  });
  if(mids.pri.length===0 && mids.sec.length){ const m=M[mids.sec[0]]; if(m) addp(mains, m.mother, m.name+"母穴（补）", "佐病经补母（主病经待部位确认）"); }
  // ── 佐穴（备选·中病即止）：主病经原络 / 俞募（脏病或久病）+ 强信号佐经原穴 ──
  mids.pri.forEach(k=>{ const m=M[k]; if(!m) return;
    addp(aux, m.yuan+"（原）", m.name+"原穴", "原络相配（虚实皆治）");
    addp(aux, m.luo+"（络）", "表里："+(m.tabs||"")+"络穴", "原络相配");
    const visceral = state.answers.signals.some(sid=>{ const s=SIGNALS.find(x=>x.id===sid); return s && s.m.includes(k); });
    if(visceral){ addp(aux, m.mu+"（募）", m.name+"募穴", "俞募治疗·内脏病"); addp(aux, m.shu+"（俞）", m.name+"背俞", "俞募治疗"); }
  });
  mids.sec.forEach(k=>{ if(!M[k] || k===primary) return;
    const sup=countSupport(k);
    if(sup>=2){ addp(aux, M[k].yuan+"（原）", M[k].name+"原穴", "佐经依据"+sup+"项，备选"); }
    else if(sup===1){ others.push(M[k].name); }
  });
  if(state.answers.sleep && state.answers.sleep!=="none") reasons.push("定时发作→当令经为佐病经（时辰辨证，指南5.5）");
  if(state.answers.course==="chronic") reasons.push("久病→可加原穴安五脏、脏病取井（指南6.3）");
  if(cd.v==="hot") reasons.push("热症→壮热可透天凉或放血（指南7.6）");
  if(cd.v==="cold") reasons.push("寒症→可加灸（隔姜/隔盐/隔蒜/米粒灸，指南5.3）");
  const joined=(mains.concat(aux)).map(p=>p.n).join("");
  const hasTaboo=/合谷|三阴交|肩井|昆仑|石门|关元/.test(joined);
  return {mains, aux, others, reasons, hasTaboo, primary};
}
function handDecide(xd, cd){
  if(cd.v==="cold") return {name:"灸法（隔姜灸）", note:"寒症用灸；灸单数壮，灸后引热下行", basis:"寒用灸（指南5.3、7.6）"};
  if(cd.v==="hot") return {name:"针法 · 泻（透天凉 / 放血）", note:"热症用针、禁用灸；壮热透天凉（三部紧提慢按6数）或放血", basis:"热用针、禁灸（指南5.3、7.6）"};
  if(xd.v==="xu") return {name:"针法 · 补（捻转顺经 / 呼吸补）", note:"补用阳数(3/5/7/9)、紧按慢提、出针按针孔", basis:"虚补：阳数、按针孔（指南7.6）"};
  if(xd.v==="shi") return {name:"针法 · 泻（捻转逆经 / 呼吸泻）", note:"泻用阴数(6)、紧提慢按、出针不按针孔", basis:"实泻：阴数、不按针孔（指南7.6）"};
  if(xd.v==="shi_first") return {name:"先泻后补", note:"先泻子穴再补母穴", basis:"痛多酸少先泻后补（指南5.2）"};
  if(xd.v==="xu_first") return {name:"先补后泻", note:"先补母穴再泻子穴", basis:"酸多痛少先补后泻（指南5.2）"};
  return {name:"针法（平补平泻）", note:"先引气，补泻随虚实调整", basis:"指南7.6"};
}

  if(state.answers.regionSub) h+=`<div class="found"><b>细分归经：</b>${esc(state.answers.regionSub)}</div>`;

function renderStep(){
  const st = STEPS[state.idx];

  $("qText").textContent = st.title;
  $("qHint").textContent = st.hint || "";
  const box = $("qOpts"); box.innerHTML="";
  $("obsArea").style.display="none"; $("obsArea").innerHTML="";
  if(st.type==="region"){
    REGIONS.forEach(r=>{

      d.className="opt"+(state.answers.region===r.id?" sel":"");
      d.innerHTML=`<span class="dot"></span><span>${r.label}<span class="meta">${r.note}</span></span>`;
      d.onclick=()=>{ state.answers.region=r.id; if(r.sub){ state.answers.regionSub=null; state.idx=1; } else { state.idx=2; } renderStep(); };
      box.appendChild(d);
    });
  } else if(st.type==="sub"){
    const reg=REGIONS.find(r=>r.id===state.answers.region);
    if(!reg || !reg.sub){ state.idx=2; renderStep(); return; }
    const all={t:"（不细分，按区域默认归经）",m:reg.m};
    [all].concat(reg.sub).forEach(s=>{
      const d=document.createElement("div");
      const sel = state.answers.regionSub===s.t;
      d.className="opt"+(sel?" sel":"");
      d.innerHTML=`<span class="dot"></span><span>${s.t}</span>`;
      d.onclick=()=>{ state.answers.regionSub=s.t; state.idx=2; renderStep(); };
      box.appendChild(d);
    });
  } else if(st.type==="signals"){
    SIGNALS.forEach(s=>{
      const sel = state.answers.signals.includes(s.id);
      const d=document.createElement("div");
      d.className="opt"+(sel?" sel":"");
      d.innerHTML=`<span class="dot"></span><span>${s.label}<span class="meta">${s.note}</span></span>`;
      d.onclick=()=>{ const a=state.answers.signals; if(sel){a.splice(a.indexOf(s.id),1);} else {a.push(s.id);} renderStep(); };
      box.appendChild(d);
    });
  } else if(st.type==="obs"){
    let h=`<div class="grp"><div class="glabel">望诊（第三篇·倪师特色）</div><div class="gnote">在病人身上实际观察后勾选；无把握不勾</div>`;
    WANG.forEach(w=>{ h+=`<label class="chk"><input type="checkbox" value="${w.id}" ${state.answers.obs.wang.includes(w.id)?"checked":""}><span>${w.label}<span class="ct">（${w.note}）</span></span></label>`; });
    h+=`</div>`;
    h+=`<div class="grp"><div class="glabel">触诊按压（第四篇）</div><div class="gnote">阿是/背俞/腹诊/特定穴压痛/脉位存亡</div>`;
    CHU.forEach(c=>{ h+=`<label class="chk"><input type="checkbox" value="${c.id}" ${state.answers.obs.chu.includes(c.id)?"checked":""}><span>${c.label}<span class="ct">（${c.note}）</span></span></label>`; });
    h+=`</div>`;
    h+=`<div class="grp"><div class="glabel">安全门（第一道·命中即提示当下不宜下针）</div>`;
    SAFETY.forEach(s=>{ h+=`<label class="chk"><input type="checkbox" value="${s.id}" ${state.answers.obs.safety.includes(s.id)?"checked":""}><span>${s.label}</span></label>`; });
    h+=`</div>`;
    $("obsArea").innerHTML=h; $("obsArea").style.display="block";
    box.innerHTML=`<div class="found" style="font-size:13px;color:#6b655c">勾选上方观察项后点「完成诊断」；无把握可直接完成。</div>`;
    $("obsArea").querySelectorAll("input").forEach(inp=>{
      inp.addEventListener("change",function(){
        const grp = this.closest(".grp"); const isWang = grp.querySelector(".glabel").textContent.includes("望诊");
        const isChu = grp.querySelector(".glabel").textContent.includes("触诊");
        const key = isWang?"wang":(isChu?"chu":"safety");
        const arr = state.answers.obs[key];
        if(this.checked){ if(!arr.includes(this.value)) arr.push(this.value); }
        else { const i=arr.indexOf(this.value); if(i>-1) arr.splice(i,1); }
      });
    });
  } else {
    st.opts.forEach(o=>{
      const sel = state.answers[st.key]===o.v;
      const d=document.createElement("div");
      d.className="opt"+(sel?" sel":"");
      d.innerHTML=`<span class="dot"></span><span>${o.t}</span>`;
      d.onclick=()=>{ state.answers[st.key]=o.v; renderStep(); };
      box.appendChild(d);
    });
  }
  const last = state.idx===STEPS.length-1;
  $("btnNext").textContent = last ? "完成诊断" : "下一题";
  $("btnBack").disabled = (state.idx===0);
}
function back(){ if(state.idx>0){ state.idx--; renderStep(); } }
function next(){ if(state.idx<STEPS.length-1){ state.idx++; renderStep(); return; } renderResult(false); $("wizard").style.display="none"; $("prog").style.display="none"; $("result").style.display="block"; window.scrollTo({top:0,behavior:"smooth"}); }

/* 初始化标签 + 默认显示部位向导 */
(function(){ $("tags").innerHTML = DICT_TAGS.map(t=>`<span class="tag">${t}</span>`).join(""); $("wizard").style.display="block"; $("prog").style.display="flex"; renderStep(); })();

</script>
</body>
</html>
